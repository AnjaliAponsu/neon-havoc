<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Player Core -->
    <circle cx="65" cy="90" r="16" fill="#00f0ff" filter="url(#glowCyan)" opacity="0.9"/>
    <circle cx="65" cy="90" r="8" fill="#ffffff" />
    <!-- Rapid Fire Emitter Lines -->
    <path d="M 85 82 L 140 76" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M 125 90 L 195 90" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M 175 98 L 235 96" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Velocity Streak Trails -->
    <line x1="88" y1="76" x2="115" y2="76" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="145" y1="90" x2="180" y2="90" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-dasharray="4 2"/>
    <line x1="205" y1="96" x2="230" y2="96" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Target Impact -->
    <circle cx="260" cy="92" r="14" fill="#ff0055" filter="url(#glowPink)"/>
    <circle cx="260" cy="92" r="7" fill="#ffe600" />
    <!-- Impact Sparks -->
    <path d="M 250 82 L 238 72 M 265 78 L 275 68 M 270 98 L 285 106 M 255 104 L 246 116" stroke="#ffe600" stroke-width="2" stroke-linecap="round" />
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">+25% FIRE RATE</text>
  
</svg>