<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Magnetic Flux Rings -->
    <circle cx="160" cy="90" r="75" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="160" cy="90" r="50" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="160" cy="90" r="28" fill="none" stroke="rgba(0, 240, 255, 0.7)" stroke-width="2.5" filter="url(#glowCyan)"/>
    <!-- Player Core -->
    <circle cx="160" cy="90" r="15" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="160" cy="90" r="7" fill="#ffffff"/>
    <!-- Inward Magnet Trajectory Lines with Crystals -->
    <!-- Top Left Gem -->
    <polygon points="80,50 86,42 92,50 86,58" fill="#ffe600" filter="url(#glowGold)"/>
    <line x1="94" y1="56" x2="140" y2="80" stroke="#ffe600" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Bottom Left Gem -->
    <polygon points="65,130 72,120 79,130 72,140" fill="#00f0ff" filter="url(#glowCyan)"/>
    <line x1="82" y1="125" x2="138" y2="100" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Top Right Gem -->
    <polygon points="245,45 252,36 259,45 252,54" fill="#00f0ff" filter="url(#glowCyan)"/>
    <line x1="242" y1="52" x2="182" y2="80" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Bottom Right Gem -->
    <polygon points="250,135 258,124 266,135 258,146" fill="#ffe600" filter="url(#glowGold)"/>
    <line x1="245" y1="127" x2="185" y2="100" stroke="#ffe600" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">+50% MAGNET</text>
  
</svg>