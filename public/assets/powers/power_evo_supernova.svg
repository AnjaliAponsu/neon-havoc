<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Crown -->
    <g transform="translate(45, 30)">
      <polygon points="0,14 6,0 12,8 18,0 24,14" fill="#ffaa00" filter="url(#glowGold)"/>
    </g>
    <!-- Core Emitter -->
    <circle cx="55" cy="95" r="16" fill="#ff7700" filter="url(#glowGold)"/>
    <circle cx="55" cy="95" r="8" fill="#ffffff"/>
    <line x1="75" y1="95" x2="160" y2="95" stroke="#ffaa00" stroke-width="4"/>
    <!-- Supernova Detonation Center -->
    <g transform="translate(200, 95)">
      <circle cx="0" cy="0" r="32" fill="rgba(255, 120, 0, 0.3)" filter="url(#glowGold)"/>
      <circle cx="0" cy="0" r="16" fill="#ffea00" filter="url(#glowGold)"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      <!-- 8 Fragment Shrapnel Bombs -->
      <g fill="#ff3300" stroke="#ffea00" stroke-width="2">
        <circle cx="-35" cy="-30" r="6"/>
        <circle cx="0" cy="-45" r="6"/>
        <circle cx="35" cy="-30" r="6"/>
        <circle cx="45" cy="0" r="6"/>
        <circle cx="35" cy="30" r="6"/>
        <circle cx="0" cy="45" r="6"/>
        <circle cx="-35" cy="30" r="6"/>
      </g>
      <!-- Detonation Shockwave Rings -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#ffea00" stroke-width="2" stroke-dasharray="6 4"/>
    </g>
    <!-- Text Badge -->
    <rect x="155" y="20" width="150" height="26" rx="6" fill="rgba(255, 170, 0, 0.2)" stroke="#ffaa00" stroke-width="1.5"/>
    <text x="230" y="38" font-family="monospace" font-size="11" fill="#ffaa00" font-weight="bold" text-anchor="middle">💥👑 SUPERNOVA FLAK</text>
  
</svg>