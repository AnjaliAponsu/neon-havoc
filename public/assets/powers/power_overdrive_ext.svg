<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Radiant Hypercharged Overdrive Aura -->
    <circle cx="160" cy="95" r="55" fill="none" stroke="#ffe600" stroke-width="2.5" filter="url(#glowGold)"/>
    <circle cx="160" cy="95" r="42" fill="none" stroke="#ff00aa" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="160" cy="95" r="30" fill="rgba(255, 230, 0, 0.2)"/>
    <!-- Central Overdriven Core -->
    <circle cx="160" cy="95" r="18" fill="#ffe600" filter="url(#glowGold)"/>
    <circle cx="160" cy="95" r="9" fill="#ffffff"/>
    <!-- 8 Directional Energy Rays -->
    <g stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glowCyan)">
      <line x1="160" y1="65" x2="160" y2="35"/>
      <line x1="160" y1="125" x2="160" y2="155"/>
      <line x1="130" y1="95" x2="100" y2="95"/>
      <line x1="190" y1="95" x2="220" y2="95"/>
      <line x1="139" y1="74" x2="118" y2="53"/>
      <line x1="181" y1="116" x2="202" y2="137"/>
      <line x1="139" y1="116" x2="118" y2="137"/>
      <line x1="181" y1="74" x2="202" y2="53"/>
    </g>
    <!-- Text Badge -->
    <rect x="165" y="20" width="140" height="26" rx="6" fill="rgba(255, 230, 0, 0.2)" stroke="#ffe600" stroke-width="1"/>
    <text x="235" y="38" font-family="monospace" font-size="11" fill="#ffe600" font-weight="bold" text-anchor="middle">+3.5s DURATION / +40%</text>
  
</svg>