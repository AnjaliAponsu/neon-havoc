<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Player Core Charging Beam -->
    <circle cx="50" cy="90" r="16" fill="#ff00ff" filter="url(#glowPink)"/>
    <circle cx="50" cy="90" r="8" fill="#ffffff"/>
    <!-- Laser Core Core &amp; Aura -->
    <line x1="68" y1="90" x2="290" y2="90" stroke="rgba(255, 0, 255, 0.4)" stroke-width="14" stroke-linecap="round" filter="url(#glowPink)"/>
    <line x1="68" y1="90" x2="290" y2="90" stroke="#ff00ff" stroke-width="7" stroke-linecap="round"/>
    <line x1="68" y1="90" x2="290" y2="90" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Enemies Disintegrating in Beam Path -->
    <circle cx="140" cy="90" r="14" fill="#ffe600" filter="url(#glowGold)"/>
    <circle cx="215" cy="90" r="15" fill="#ffe600" filter="url(#glowGold)"/>
    <circle cx="270" cy="90" r="12" fill="#ff0055"/>
    <!-- Disintegration Radiation lines -->
    <line x1="140" y1="70" x2="140" y2="110" stroke="#ffffff" stroke-width="2"/>
    <line x1="215" y1="68" x2="215" y2="112" stroke="#ffffff" stroke-width="2"/>
    <!-- Text Badge -->
    <rect x="175" y="20" width="130" height="26" rx="6" fill="rgba(255, 0, 255, 0.2)" stroke="#ff00ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#ff00ff" font-weight="bold" text-anchor="middle">CONTINUOUS BEAM</text>
  
</svg>