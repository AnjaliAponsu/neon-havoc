<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Concentric Shockwave Rings -->
    <circle cx="160" cy="95" r="70" fill="none" stroke="rgba(0,255,200,0.3)" stroke-width="2"/>
    <circle cx="160" cy="95" r="50" fill="none" stroke="#00ffc8" stroke-width="3" stroke-dasharray="8 4" filter="url(#glowCyan)"/>
    <circle cx="160" cy="95" r="28" fill="rgba(0,255,200,0.2)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Player Core -->
    <circle cx="160" cy="95" r="14" fill="#00ffc8" filter="url(#glowCyan)"/>
    <circle cx="160" cy="95" r="7" fill="#ffffff"/>
    <!-- Enemies Knocked Back Radially -->
    <!-- Enemy Top-Left -->
    <circle cx="100" cy="50" r="12" fill="#ff0055"/>
    <line x1="110" y1="60" x2="85" y2="40" stroke="#ffe600" stroke-width="2" stroke-linecap="round"/>
    <!-- Enemy Right -->
    <circle cx="235" cy="95" r="12" fill="#ff0055"/>
    <line x1="225" y1="95" x2="255" y2="95" stroke="#ffe600" stroke-width="2" stroke-linecap="round"/>
    <!-- Enemy Bottom-Left -->
    <circle cx="95" cy="140" r="12" fill="#ff0055"/>
    <line x1="105" y1="130" x2="80" y2="150" stroke="#ffe600" stroke-width="2" stroke-linecap="round"/>
    <!-- Text Badge -->
    <rect x="165" y="20" width="140" height="26" rx="6" fill="rgba(0, 255, 200, 0.2)" stroke="#00ffc8" stroke-width="1"/>
    <text x="235" y="38" font-family="monospace" font-size="11" fill="#00ffc8" font-weight="bold" text-anchor="middle">+60% DMG / +45% AOE</text>
  
</svg>