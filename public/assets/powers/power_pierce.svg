<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Player Core -->
    <circle cx="55" cy="90" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <!-- Piercing Quantum Beam Line -->
    <line x1="75" y1="90" x2="270" y2="90" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
    <line x1="75" y1="90" x2="270" y2="90" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Enemy 1 being Phased Through -->
    <circle cx="145" cy="90" r="18" fill="none" stroke="#ff0055" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="145" cy="90" r="12" fill="#ff0055" opacity="0.3"/>
    <!-- Quantum Phase Rings at intersection -->
    <ellipse cx="145" cy="90" rx="6" ry="16" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glowCyan)"/>
    <!-- Enemy 2 Behind Being Struck -->
    <circle cx="230" cy="90" r="16" fill="#ff0055" filter="url(#glowPink)"/>
    <ellipse cx="230" cy="90" rx="6" ry="16" fill="none" stroke="#ffe600" stroke-width="2"/>
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">+1 PIERCE</text>
  
</svg>