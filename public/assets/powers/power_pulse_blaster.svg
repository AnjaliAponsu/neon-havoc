<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Player Core -->
    <circle cx="65" cy="90" r="16" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="65" cy="90" r="8" fill="#ffffff"/>
    <!-- Precision Firing Arc -->
    <line x1="88" y1="90" x2="160" y2="90" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
    <line x1="175" y1="90" x2="235" y2="90" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
    <line x1="88" y1="90" x2="235" y2="90" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crosshair Aim Reticle at Target -->
    <g transform="translate(255, 90)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="-22" y1="0" x2="-8" y2="0" stroke="#00f0ff" stroke-width="2"/>
      <line x1="8" y1="0" x2="22" y2="0" stroke="#00f0ff" stroke-width="2"/>
      <line x1="0" y1="-22" x2="0" y2="-8" stroke="#00f0ff" stroke-width="2"/>
      <line x1="0" y1="8" x2="0" y2="22" stroke="#00f0ff" stroke-width="2"/>
      <!-- Target Enemy Dot -->
      <circle cx="0" cy="0" r="10" fill="#ff0055" filter="url(#glowPink)"/>
    </g>
    <!-- Text Badge -->
    <rect x="175" y="20" width="130" height="26" rx="6" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">RAPID PULSE BOLTS</text>
  
</svg>