<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- High Energy Core -->
    <circle cx="65" cy="90" r="16" fill="#ffe600" filter="url(#glowGold)"/>
    <circle cx="65" cy="90" r="8" fill="#ffffff"/>
    <!-- Violent Electric Lightning Sparks -->
    <path d="M 85 90 Q 110 70 135 95 T 185 80 T 235 92" fill="none" stroke="#ffe600" stroke-width="3" filter="url(#glowGold)"/>
    <path d="M 85 85 Q 120 110 160 85 T 235 95" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Spiked Plasma Round -->
    <circle cx="170" cy="88" r="12" fill="#ffe600" filter="url(#glowGold)"/>
    <circle cx="170" cy="88" r="6" fill="#ffffff"/>
    <!-- Exploding Heavy Target -->
    <circle cx="255" cy="90" r="18" fill="#ff0055" opacity="0.6"/>
    <circle cx="255" cy="90" r="12" fill="#ffe600" filter="url(#glowGold)"/>
    <!-- Cracking Voltage Lines -->
    <path d="M 240 75 L 255 90 L 270 78 M 255 90 L 242 108 M 255 90 L 274 102" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(255, 230, 0, 0.15)" stroke="#ffe600" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#ffe600" font-weight="bold" text-anchor="middle">+20% DAMAGE</text>
  
</svg>