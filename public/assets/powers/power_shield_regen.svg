<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Hexagonal Barrier Shield -->
    <polygon points="160,35 215,65 215,125 160,155 105,125 105,65" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
    <!-- Inner Spark Player -->
    <circle cx="160" cy="95" r="16" fill="#00f0ff"/>
    <circle cx="160" cy="95" r="8" fill="#ffffff"/>
    <!-- Incoming Bullets Deflected &amp; Shattered -->
    <circle cx="70" cy="65" r="6" fill="#ff0055"/>
    <path d="M 76 65 L 105 75" stroke="#ff0055" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="106" cy="76" r="4" fill="#ffe600" filter="url(#glowGold)"/>
    <!-- Impact Sparks -->
    <line x1="106" y1="76" x2="98" y2="70" stroke="#ffe600" stroke-width="2"/>
    <line x1="106" y1="76" x2="100" y2="84" stroke="#ffe600" stroke-width="2"/>

    <circle cx="245" cy="115" r="6" fill="#ff0055"/>
    <path d="M 239 115 L 214 110" stroke="#ff0055" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="214" cy="110" r="4" fill="#ffe600" filter="url(#glowGold)"/>
    <!-- Text Badge -->
    <rect x="175" y="20" width="130" height="26" rx="6" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">45 HP REGEN SHIELD</text>
  
</svg>