<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Crown / Evolution Crest -->
    <g transform="translate(45, 30)">
      <polygon points="0,14 6,0 12,8 18,0 24,14" fill="#ffe600" filter="url(#glowGold)"/>
    </g>
    <!-- Player Core -->
    <circle cx="60" cy="95" r="18" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="60" cy="95" r="9" fill="#ffffff"/>
    <!-- Massive Hyper-Velocity Rail Beam -->
    <line x1="82" y1="95" x2="295" y2="95" stroke="rgba(255, 255, 255, 0.4)" stroke-width="16" stroke-linecap="round" filter="url(#glowCyan)"/>
    <line x1="82" y1="95" x2="295" y2="95" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
    <line x1="82" y1="95" x2="295" y2="95" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Helix Electric Coils Wrapping Rail Beam -->
    <path d="M 95 85 Q 115 65 135 95 T 175 95 T 215 95 T 255 95" fill="none" stroke="#ffe600" stroke-width="2.5" filter="url(#glowGold)"/>
    <path d="M 95 105 Q 115 125 135 95 T 175 95 T 215 95 T 255 95" fill="none" stroke="#ffe600" stroke-width="2.5" filter="url(#glowGold)"/>
    <!-- Vaporized Heavy Hostiles with Shock Discharge -->
    <circle cx="170" cy="95" r="15" fill="#ffe600"/>
    <circle cx="260" cy="95" r="16" fill="#ffe600"/>
    <!-- Text Badge -->
    <rect x="155" y="20" width="150" height="26" rx="6" fill="rgba(255, 230, 0, 0.2)" stroke="#ffe600" stroke-width="1.5"/>
    <text x="230" y="38" font-family="monospace" font-size="11" fill="#ffe600" font-weight="bold" text-anchor="middle">⚡👑 EVOLVED RAILGUN</text>
  
</svg>