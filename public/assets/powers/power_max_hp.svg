<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Outer Shield Hexagons -->
    <polygon points="160,35 210,65 210,120 160,150 110,120 110,65" fill="none" stroke="#00ff88" stroke-width="2.5" filter="url(#glowCyan)" opacity="0.8"/>
    <polygon points="160,48 198,72 198,114 160,138 122,114 122,72" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-width="1.5"/>
    <!-- Heart / Core Spark -->
    <circle cx="160" cy="92" r="18" fill="#ff0055" filter="url(#glowPink)"/>
    <circle cx="160" cy="92" r="10" fill="#ffffff"/>
    <!-- Plus / Health Crosses -->
    <g fill="#00ff88" filter="url(#glowCyan)">
      <!-- Left Cross -->
      <path d="M 60 85 H 70 V 75 H 76 V 85 H 86 V 91 H 76 V 101 H 70 V 91 H 60 Z"/>
      <!-- Right Cross -->
      <path d="M 235 85 H 245 V 75 H 251 V 85 H 261 V 91 H 251 V 101 H 245 V 91 H 235 Z"/>
    </g>
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00ff88" font-weight="bold" text-anchor="middle">+35 MAX HP</text>
  
</svg>