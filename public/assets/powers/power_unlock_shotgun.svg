<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Player Core -->
    <circle cx="55" cy="90" r="16" fill="#ff8800" filter="url(#glowGold)"/>
    <circle cx="55" cy="90" r="8" fill="#ffffff"/>
    <!-- 5 Plasma Pellets Spreading Cone -->
    <!-- Pellet 1 (Up) -->
    <circle cx="180" cy="45" r="9" fill="#ff5500" filter="url(#glowGold)"/>
    <line x1="75" y1="84" x2="170" y2="49" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Pellet 2 -->
    <circle cx="210" cy="68" r="9" fill="#ff7700" filter="url(#glowGold)"/>
    <line x1="75" y1="87" x2="200" y2="70" stroke="#ffaa00" stroke-width="2"/>
    <!-- Pellet 3 (Center Heavy) -->
    <circle cx="225" cy="90" r="11" fill="#ffaa00" filter="url(#glowGold)"/>
    <circle cx="225" cy="90" r="5" fill="#ffffff"/>
    <line x1="75" y1="90" x2="212" y2="90" stroke="#ffaa00" stroke-width="3"/>
    <!-- Pellet 4 -->
    <circle cx="210" cy="112" r="9" fill="#ff7700" filter="url(#glowGold)"/>
    <line x1="75" y1="93" x2="200" y2="110" stroke="#ffaa00" stroke-width="2"/>
    <!-- Pellet 5 (Down) -->
    <circle cx="180" cy="135" r="9" fill="#ff5500" filter="url(#glowGold)"/>
    <line x1="75" y1="96" x2="170" y2="131" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Hostiles vaporized in cone -->
    <circle cx="270" cy="70" r="14" fill="#ff0055" opacity="0.6"/>
    <circle cx="270" cy="110" r="14" fill="#ff0055" opacity="0.6"/>
    <!-- Text Badge -->
    <rect x="175" y="20" width="130" height="26" rx="6" fill="rgba(255, 136, 0, 0.2)" stroke="#ff8800" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#ffaa00" font-weight="bold" text-anchor="middle">5-PELLET CONE</text>
  
</svg>