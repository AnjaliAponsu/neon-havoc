<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Player Core with Dual Pods -->
    <circle cx="70" cy="90" r="16" fill="#aa00ff" filter="url(#glowPink)"/>
    <circle cx="70" cy="90" r="8" fill="#ffffff"/>
    <!-- Upper Stream -->
    <line x1="88" y1="80" x2="160" y2="65" stroke="#aa00ff" stroke-width="4" stroke-linecap="round" filter="url(#glowPink)"/>
    <line x1="170" y1="62" x2="240" y2="48" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Lower Stream -->
    <line x1="88" y1="100" x2="160" y2="115" stroke="#aa00ff" stroke-width="4" stroke-linecap="round" filter="url(#glowPink)"/>
    <line x1="170" y1="118" x2="240" y2="132" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Targets being hit simultaneously -->
    <circle cx="255" cy="45" r="12" fill="#ff0055"/>
    <circle cx="255" cy="135" r="12" fill="#ff0055"/>
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(170, 0, 255, 0.2)" stroke="#aa00ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#da70d6" font-weight="bold" text-anchor="middle">+1 PROJECTILE</text>
  
</svg>