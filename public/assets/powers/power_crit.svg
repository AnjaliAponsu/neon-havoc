<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Spark Player -->
    <circle cx="65" cy="90" r="15" fill="#ffe600" filter="url(#glowGold)"/>
    <circle cx="65" cy="90" r="8" fill="#ffffff"/>
    <!-- Energy Bolt -->
    <line x1="85" y1="90" x2="190" y2="90" stroke="#ffe600" stroke-width="4" stroke-linecap="round" filter="url(#glowGold)"/>
    <!-- Critical Strike Starburst Blast -->
    <g transform="translate(225, 90)">
      <circle cx="0" cy="0" r="30" fill="rgba(255,230,0,0.25)" filter="url(#glowGold)"/>
      <path d="M 0 -35 L 5 -10 L 35 0 L 5 10 L 0 35 L -5 10 L -35 0 L -5 -10 Z" fill="#ffffff" filter="url(#glowGold)"/>
      <path d="M -22 -22 L 0 -7 L 22 -22 L 7 0 L 22 22 L 0 7 L -22 22 L -7 0 Z" fill="#ffe600"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    </g>
    <!-- Text Badge -->
    <rect x="175" y="20" width="130" height="26" rx="6" fill="rgba(255, 230, 0, 0.2)" stroke="#ffe600" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#ffe600" font-weight="bold" text-anchor="middle">+15% CRIT (2.5x)</text>
  
</svg>