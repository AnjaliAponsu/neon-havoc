<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Electric Dash Residual Line -->
    <path d="M 40 90 L 80 82 L 120 98 L 160 85 L 200 95 L 235 90" fill="none" stroke="#00f0ff" stroke-width="3.5" filter="url(#glowCyan)"/>
    <path d="M 40 90 L 80 82 L 120 98 L 160 85 L 200 95 L 235 90" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Shocked Enemies on Trail -->
    <circle cx="95" cy="85" r="12" fill="#ff0055" opacity="0.6"/>
    <path d="M 85 80 L 105 90 M 105 80 L 85 90" stroke="#ffe600" stroke-width="2"/>
    <circle cx="170" cy="92" r="12" fill="#ff0055" opacity="0.6"/>
    <path d="M 160 87 L 180 97 M 180 87 L 160 97" stroke="#ffe600" stroke-width="2"/>
    <!-- Player at End of Dash with After-Image Glow -->
    <circle cx="240" cy="90" r="18" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="240" cy="90" r="8" fill="#ffffff"/>
    <!-- Dash Speed Chevrons -->
    <path d="M 270 82 L 282 90 L 270 98" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
    <!-- Text Badge -->
    <rect x="160" y="20" width="145" height="26" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1"/>
    <text x="232" y="38" font-family="monospace" font-size="11" fill="#00f0ff" font-weight="bold" text-anchor="middle">-25% CD / +1 CHARGE</text>
  
</svg>