<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="320" height="180" fill="url(#cardBgGrad)" rx="10" />
  <rect width="320" height="180" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="320" height="180" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Jet Propulsion Exhaust Trails -->
    <path d="M 120 90 Q 60 70 25 65 Q 60 90 20 90 Q 60 90 25 115 Q 60 110 120 90 Z" fill="rgba(0,240,255,0.4)" filter="url(#glowCyan)"/>
    <path d="M 110 90 Q 60 80 45 75 Q 70 90 40 90 Q 70 90 45 105 Q 60 100 110 90 Z" fill="#00f0ff"/>
    <line x1="30" y1="50" x2="90" y2="50" stroke="rgba(0,240,255,0.5)" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="20" y1="130" x2="80" y2="130" stroke="rgba(0,240,255,0.5)" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="50" y1="35" x2="130" y2="35" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <!-- Player Core Fast Forward -->
    <circle cx="140" cy="90" r="18" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="140" cy="90" r="9" fill="#ffffff"/>
    <!-- Motion Vector Chevron Arrows -->
    <path d="M 180 80 L 195 90 L 180 100" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M 210 80 L 225 90 L 210 100" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 240 80 L 255 90 L 240 100" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- Outmaneuvered Enemy Falling Behind -->
    <circle cx="60" cy="140" r="12" fill="#ff0055" opacity="0.7"/>
    <!-- Text Badge -->
    <rect x="180" y="20" width="120" height="26" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1"/>
    <text x="240" y="38" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">+18% SPEED</text>
  
</svg>