<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="560" height="220" fill="url(#cardBgGrad)" rx="10" />
  <rect width="560" height="220" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="560" height="220" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Panel Left: Movement &amp; Inertia -->
    <rect x="20" y="20" width="250" height="180" rx="8" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    <text x="145" y="44" font-family="monospace" font-size="13" fill="#00f0ff" font-weight="bold" text-anchor="middle">MOVEMENT &amp; INERTIA DRIFT</text>
    <!-- WASD Keys Cluster -->
    <g transform="translate(45, 65)">
      <!-- W -->
      <rect x="32" y="0" width="28" height="28" rx="5" fill="#0d1b33" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="46" y="19" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">W</text>
      <!-- A -->
      <rect x="0" y="32" width="28" height="28" rx="5" fill="#0d1b33" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="14" y="51" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">A</text>
      <!-- S -->
      <rect x="32" y="32" width="28" height="28" rx="5" fill="#0d1b33" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="46" y="51" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">S</text>
      <!-- D -->
      <rect x="64" y="32" width="28" height="28" rx="5" fill="#0d1b33" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="78" y="51" font-family="monospace" font-size="12" fill="#00f0ff" font-weight="bold" text-anchor="middle">D</text>
    </g>
    <!-- Inertial Motion Trail -->
    <path d="M 160 135 Q 185 105 210 115" fill="none" stroke="rgba(0,240,255,0.4)" stroke-width="3" stroke-dasharray="6 4"/>
    <!-- Player 1 Spark-01 -->
    <circle cx="215" cy="115" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="215" cy="115" r="7" fill="#ffffff"/>
    <text x="145" y="185" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Smooth frictionless drifting in deep space</text>

    <!-- Panel Right: Twin-Stick Aim &amp; Auto-Fire -->
    <rect x="290" y="20" width="250" height="180" rx="8" fill="rgba(255, 0, 170, 0.05)" stroke="rgba(255, 0, 170, 0.3)" stroke-width="1"/>
    <text x="415" y="44" font-family="monospace" font-size="13" fill="#ff00aa" font-weight="bold" text-anchor="middle">TWIN-STICK AIM &amp; AUTO-FIRE</text>
    <!-- Spark-01 Firing -->
    <circle cx="340" cy="115" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="340" cy="115" r="7" fill="#ffffff"/>
    <!-- Projected Bullets -->
    <line x1="360" y1="115" x2="420" y2="115" stroke="#00f0ff" stroke-width="3.5" filter="url(#glowCyan)"/>
    <line x1="390" y1="108" x2="445" y2="108" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
    <!-- Reticle on Enemy -->
    <g transform="translate(485, 112)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#ffe600" stroke-width="1.5" stroke-dasharray="4 2"/>
      <circle cx="0" cy="0" r="12" fill="#ff0055" filter="url(#glowPink)"/>
    </g>
    <!-- [C] Auto-Fire Toggle Pill -->
    <rect x="350" y="145" width="130" height="22" rx="4" fill="#13203c" stroke="#ffe600" stroke-width="1"/>
    <text x="415" y="160" font-family="monospace" font-size="10" fill="#ffe600" font-weight="bold" text-anchor="middle">TOGGLE [C]: AUTO-FIRE</text>
    <text x="415" y="185" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Mouse / Right-Stick 360° targeting</text>
  
</svg>