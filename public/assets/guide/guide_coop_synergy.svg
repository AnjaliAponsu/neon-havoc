<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="560" height="220" fill="url(#cardBgGrad)" rx="10" />
  <rect width="560" height="220" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="560" height="220" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Left: Energy Tether Revive -->
    <rect x="20" y="20" width="250" height="180" rx="8" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    <text x="145" y="44" font-family="monospace" font-size="13" fill="#00f0ff" font-weight="bold" text-anchor="middle">CO-OP REVIVAL TETHER</text>
    <!-- Fallen Teammate Beacon -->
    <circle cx="70" cy="115" r="32" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="70" cy="115" r="14" fill="#ff0055" opacity="0.6"/>
    <text x="70" y="98" font-family="monospace" font-size="9" fill="#ff0055" text-anchor="middle">DOWNED</text>
    <!-- Living Teammate -->
    <circle cx="180" cy="115" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="180" cy="115" r="7" fill="#ffffff"/>
    <!-- Glowing Revival Tether -->
    <line x1="84" y1="115" x2="166" y2="115" stroke="#00ff88" stroke-width="4" stroke-dasharray="6 3" filter="url(#glowCyan)"/>
    <text x="125" y="132" font-family="monospace" font-size="10" fill="#00ff88" font-weight="bold" text-anchor="middle">REVIVING (2.2s)</text>
    <text x="145" y="180" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Stand inside distress radius to resurrect partner</text>

    <!-- Right: Harmonic Convergence Laser -->
    <rect x="290" y="20" width="250" height="180" rx="8" fill="rgba(255, 230, 0, 0.05)" stroke="rgba(255, 230, 0, 0.3)" stroke-width="1"/>
    <text x="415" y="44" font-family="monospace" font-size="13" fill="#ffe600" font-weight="bold" text-anchor="middle">HARMONIC CONVERGENCE</text>
    <!-- Player 1 (Cyan) -->
    <circle cx="340" cy="115" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="340" cy="115" r="7" fill="#ffffff"/>
    <text x="340" y="142" font-family="monospace" font-size="9" fill="#00f0ff" text-anchor="middle">P1 SPARK</text>
    <!-- Player 2 (Magenta) -->
    <circle cx="490" cy="115" r="14" fill="#ff00aa" filter="url(#glowPink)"/>
    <circle cx="490" cy="115" r="7" fill="#ffffff"/>
    <text x="490" y="142" font-family="monospace" font-size="9" fill="#ff00aa" text-anchor="middle">P2 NOVA</text>
    <!-- Dual Resonance Destruction Beam -->
    <line x1="354" y1="115" x2="476" y2="115" stroke="rgba(255, 230, 0, 0.4)" stroke-width="14" stroke-linecap="round" filter="url(#glowGold)"/>
    <line x1="354" y1="115" x2="476" y2="115" stroke="#ffe600" stroke-width="6" stroke-linecap="round"/>
    <line x1="354" y1="115" x2="476" y2="115" stroke="#ffffff" stroke-width="2"/>
    <!-- Enemies Disintegrated in Between -->
    <circle cx="415" cy="115" r="12" fill="#ffe600" filter="url(#glowGold)"/>
    <text x="415" y="180" font-family="sans-serif" font-size="11" fill="#ffe600" text-anchor="middle">Both trigger Overdrive = Screen-clearing beam!</text>
  
</svg>