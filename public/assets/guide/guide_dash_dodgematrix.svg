<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="560" height="220" fill="url(#cardBgGrad)" rx="10" />
  <rect width="560" height="220" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="560" height="220" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Left: Lightning Dash Phase -->
    <rect x="20" y="20" width="250" height="180" rx="8" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    <text x="145" y="44" font-family="monospace" font-size="13" fill="#00f0ff" font-weight="bold" text-anchor="middle">LIGHTNING DASH [Q / R-CLICK]</text>
    <!-- Ghost after-image 1 -->
    <circle cx="65" cy="115" r="14" fill="#00f0ff" opacity="0.25"/>
    <!-- Ghost after-image 2 -->
    <circle cx="115" cy="115" r="14" fill="#00f0ff" opacity="0.5"/>
    <!-- Invulnerable Trail Through Dense Swarm -->
    <line x1="65" y1="115" x2="200" y2="115" stroke="#00f0ff" stroke-width="4" stroke-dasharray="8 4" filter="url(#glowCyan)"/>
    <!-- Enemy Swarm passing harmlessly through -->
    <circle cx="115" cy="90" r="11" fill="#ff0055"/>
    <circle cx="115" cy="140" r="11" fill="#ff0055"/>
    <!-- Active Player Core -->
    <circle cx="205" cy="115" r="15" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="205" cy="115" r="8" fill="#ffffff"/>
    <text x="145" y="180" font-family="sans-serif" font-size="11" fill="#00ffea" text-anchor="middle">Total invulnerability while dashing!</text>

    <!-- Right: Dodge Matrix Bullet-Time -->
    <rect x="290" y="20" width="250" height="180" rx="8" fill="rgba(255, 230, 0, 0.05)" stroke="rgba(255, 230, 0, 0.3)" stroke-width="1"/>
    <text x="415" y="44" font-family="monospace" font-size="13" fill="#ffe600" font-weight="bold" text-anchor="middle">DODGE MATRIX: BULLET-TIME</text>
    <!-- Bullet-Time Bubble Field -->
    <circle cx="415" cy="115" r="52" fill="rgba(0, 240, 255, 0.08)" stroke="#ffe600" stroke-width="2" stroke-dasharray="6 3" filter="url(#glowGold)"/>
    <!-- Player in Center -->
    <circle cx="415" cy="115" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="415" cy="115" r="7" fill="#ffffff"/>
    <!-- Incoming Bullets Slowed Down in Matrix -->
    <circle cx="380" cy="85" r="6" fill="#ff0055"/>
    <line x1="365" y1="72" x2="380" y2="85" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="450" cy="140" r="6" fill="#ff0055"/>
    <line x1="465" y1="152" x2="450" y2="140" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="415" y="180" font-family="sans-serif" font-size="11" fill="#ffe600" text-anchor="middle">Dashing through bullets slows time by 60%</text>
  
</svg>