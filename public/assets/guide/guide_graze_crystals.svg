<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <radialGradient id="cardBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </radialGradient>
    <pattern id="arenaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>
  <rect width="560" height="220" fill="url(#cardBgGrad)" rx="10" />
  <rect width="560" height="220" fill="url(#arenaGrid)" rx="10" />
  <!-- Border Vignette -->
  <rect width="560" height="220" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" rx="10" />
  
    <!-- Left: Bullet Graze &amp; Overdrive Siphon -->
    <rect x="20" y="20" width="250" height="180" rx="8" fill="rgba(255, 0, 119, 0.05)" stroke="rgba(255, 0, 119, 0.3)" stroke-width="1"/>
    <text x="145" y="44" font-family="monospace" font-size="13" fill="#ff0077" font-weight="bold" text-anchor="middle">TACTICAL BULLET GRAZE</text>
    <!-- Graze Radius Perimeter Ring -->
    <circle cx="130" cy="110" r="42" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- Player Core -->
    <circle cx="130" cy="110" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="130" cy="110" r="7" fill="#ffffff"/>
    <!-- Bullet Skimming Right Along Perimeter -->
    <circle cx="130" cy="68" r="6" fill="#ff0055"/>
    <line x1="80" y1="68" x2="180" y2="68" stroke="#ff0055" stroke-width="2"/>
    <!-- Graze XP Sparks -->
    <circle cx="130" cy="68" r="10" fill="none" stroke="#ffe600" stroke-width="2" filter="url(#glowGold)"/>
    <text x="155" y="88" font-family="monospace" font-size="10" fill="#ffe600" font-weight="bold">+GRAZE XP</text>
    <text x="145" y="180" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Near-misses generate XP &amp; Overdrive energy</text>

    <!-- Right: Energy Crystal Magnetism -->
    <rect x="290" y="20" width="250" height="180" rx="8" fill="rgba(0, 255, 136, 0.05)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
    <text x="415" y="44" font-family="monospace" font-size="13" fill="#00ff88" font-weight="bold" text-anchor="middle">CRYSTALS &amp; LEVELING UP</text>
    <!-- Magnet Flux Field -->
    <circle cx="415" cy="110" r="48" fill="rgba(0, 255, 136, 0.08)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="415" cy="110" r="14" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="415" cy="110" r="7" fill="#ffffff"/>
    <!-- Magnetized Crystals -->
    <polygon points="360,80 366,72 372,80 366,88" fill="#ffe600" filter="url(#glowGold)"/>
    <line x1="372" y1="84" x2="398" y2="98" stroke="#ffe600" stroke-width="1.5" stroke-dasharray="3 2"/>

    <polygon points="460,75 467,66 474,75 467,84" fill="#00f0ff" filter="url(#glowCyan)"/>
    <line x1="460" y1="80" x2="430" y2="98" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 2"/>

    <polygon points="450,140 458,130 466,140 458,150" fill="#aa00ff" filter="url(#glowPink)"/>
    <line x1="448" y1="135" x2="425" y2="120" stroke="#aa00ff" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="415" y="180" font-family="sans-serif" font-size="11" fill="#00ff88" text-anchor="middle">Collect crystals to fill XP bar and choose powers</text>
  
</svg>